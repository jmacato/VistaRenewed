# Linux MinGW with an MSVCRT default; final artifacts require the Vista PE audit.
[binaries]
c = 'i686-w64-mingw32-gcc'
cpp = 'i686-w64-mingw32-g++'
ar = 'i686-w64-mingw32-ar'
strip = 'i686-w64-mingw32-strip'
windres = 'i686-w64-mingw32-windres'

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'windows'
cpu_family = 'x86'
cpu = 'x86'
endian = 'little'

[built-in options]
c_args = ['-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.wdk.x64/c/Include/10.0.28000.0/um', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.sdk.cpp/c/Include/10.0.28000.0/um', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.wdk.x64/c/Include/10.0.28000.0/shared', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.sdk.cpp/c/Include/10.0.28000.0/shared']
cpp_args = ['-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.wdk.x64/c/Include/10.0.28000.0/um', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.sdk.cpp/c/Include/10.0.28000.0/um', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.wdk.x64/c/Include/10.0.28000.0/shared', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.sdk.cpp/c/Include/10.0.28000.0/shared']
c_link_args = ['-static', '-static-libgcc', '-Wl,--subsystem,windows:6.0']
cpp_link_args = ['-static', '-static-libgcc', '-static-libstdc++', '-Wl,--subsystem,windows:6.0']

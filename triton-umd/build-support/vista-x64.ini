[binaries]
c = 'x86_64-w64-mingw32-gcc'
cpp = 'x86_64-w64-mingw32-g++'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
# bootstrap-vista-crt.sh supplies the legacy msvcrt import and support
# libraries here.  Homebrew's otherwise-compatible MinGW package makes its
# libmsvcrt.a forward to the UCRT API-set, which Vista cannot load.
c_args = ['-mcrtdll=msvcrt', '-include', '@DIRNAME@/../src/virtio/neptune/vista-d3d9/triton9_crt_compat.h', '-isystem', '@DIRNAME@/../.cache/vista-crt/x64/mingw64/include', '-B@DIRNAME@/../.cache/vista-crt/x64/mingw64/lib', '-L@DIRNAME@/../.cache/vista-crt/x64/mingw64/lib', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.wdk.x64/c/Include/10.0.28000.0/um', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.sdk.cpp/c/Include/10.0.28000.0/um', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.wdk.x64/c/Include/10.0.28000.0/shared', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.sdk.cpp/c/Include/10.0.28000.0/shared']
cpp_args = ['-mcrtdll=msvcrt', '-include', '@DIRNAME@/../src/virtio/neptune/vista-d3d9/triton9_crt_compat.h', '-isystem', '@DIRNAME@/../.cache/vista-crt/x64/mingw64/include', '-B@DIRNAME@/../.cache/vista-crt/x64/mingw64/lib', '-L@DIRNAME@/../.cache/vista-crt/x64/mingw64/lib', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.wdk.x64/c/Include/10.0.28000.0/um', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.sdk.cpp/c/Include/10.0.28000.0/um', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.wdk.x64/c/Include/10.0.28000.0/shared', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.sdk.cpp/c/Include/10.0.28000.0/shared']
c_link_args = ['-mcrtdll=msvcrt', '-B@DIRNAME@/../.cache/vista-crt/x64/mingw64/lib', '-L@DIRNAME@/../.cache/vista-crt/x64/mingw64/lib', '-static', '-static-libgcc', '-Wl,--subsystem,windows:6.0']
cpp_link_args = ['-mcrtdll=msvcrt', '-B@DIRNAME@/../.cache/vista-crt/x64/mingw64/lib', '-L@DIRNAME@/../.cache/vista-crt/x64/mingw64/lib', '-static', '-static-libgcc', '-static-libstdc++', '-Wl,--subsystem,windows:6.0']

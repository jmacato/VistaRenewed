[binaries]
c = 'i686-w64-mingw32-gcc'
cpp = 'i686-w64-mingw32-g++'
ar = 'i686-w64-mingw32-ar'
strip = 'i686-w64-mingw32-strip'
windres = 'i686-w64-mingw32-windres'

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'windows'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'

[built-in options]
# See vista-x64.ini.  The x86 archive is separate because DLL import names
# and CRT startup objects are architecture-specific.
c_args = ['-mcrtdll=msvcrt', '-include', '@DIRNAME@/../src/virtio/neptune/vista-d3d9/triton9_crt_compat.h', '-isystem', '@DIRNAME@/../.cache/vista-crt/x86/mingw32/include', '-B@DIRNAME@/../.cache/vista-crt/x86/mingw32/lib', '-L@DIRNAME@/../.cache/vista-crt/x86/mingw32/lib', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.wdk.x64/c/Include/10.0.28000.0/um', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.sdk.cpp/c/Include/10.0.28000.0/um', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.wdk.x64/c/Include/10.0.28000.0/shared', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.sdk.cpp/c/Include/10.0.28000.0/shared']
cpp_args = ['-mcrtdll=msvcrt', '-include', '@DIRNAME@/../src/virtio/neptune/vista-d3d9/triton9_crt_compat.h', '-isystem', '@DIRNAME@/../.cache/vista-crt/x86/mingw32/include', '-B@DIRNAME@/../.cache/vista-crt/x86/mingw32/lib', '-L@DIRNAME@/../.cache/vista-crt/x86/mingw32/lib', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.wdk.x64/c/Include/10.0.28000.0/um', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.sdk.cpp/c/Include/10.0.28000.0/um', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.wdk.x64/c/Include/10.0.28000.0/shared', '-idirafter', '@DIRNAME@/../../driver/sdk/microsoft.windows.sdk.cpp/c/Include/10.0.28000.0/shared']
c_link_args = ['-mcrtdll=msvcrt', '-B@DIRNAME@/../.cache/vista-crt/x86/mingw32/lib', '-L@DIRNAME@/../.cache/vista-crt/x86/mingw32/lib', '-static', '-static-libgcc', '-Wl,--subsystem,windows:6.0']
cpp_link_args = ['-mcrtdll=msvcrt', '-B@DIRNAME@/../.cache/vista-crt/x86/mingw32/lib', '-L@DIRNAME@/../.cache/vista-crt/x86/mingw32/lib', '-static', '-static-libgcc', '-static-libstdc++', '-Wl,--subsystem,windows:6.0']
